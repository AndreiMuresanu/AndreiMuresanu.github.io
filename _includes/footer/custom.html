<!-- The libraries below are large, so only load them on pages that actually use them.
     Set `math`, `plotly`, or `mermaid` to true in a page's front matter to force loading. -->

<!-- Support for MathJax -->
{% if page.math or content contains '\(' or content contains '\[' or content contains '$$' %}
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script"></script>
{% endif %}

<!-- Support for Plotly -->
{% if page.plotly or content contains 'language-plotly' %}
<script defer src='https://cdnjs.cloudflare.com/ajax/libs/plotly.js/3.0.1/plotly.min.js'></script>
{% endif %}

<!-- Support for Mermaid -->
{% if page.mermaid or content contains 'language-mermaid' %}
<script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({startOnLoad:true, theme:'default'});
    await mermaid.run({querySelector:'code.language-mermaid'});
</script>
{% endif %}

<!-- end custom footer snippets -->
